<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Currency Converter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>Currency Converter</h1>

    <div class="card">
      <div class="field">
        <label for="amount">Amount</label>
        <input type="number" id="amount" min="0" step="any" placeholder="0.00" value="1" />
      </div>

      <div class="field">
        <label for="from">From</label>
        <select id="from"></select>
      </div>

      <button id="swap" class="swap-btn" title="Swap currencies">⇄</button>

      <div class="field">
        <label for="to">To</label>
        <select id="to"></select>
      </div>

      <button id="convert" class="convert-btn">Convert</button>

      <div id="result" class="result"></div>
      <div id="error" class="error"></div>
    </div>
  </main>

  <script>
    // __API_BASE_URL__ is replaced at build time by the Vercel build script.
    window.__API_BASE__ = "__API_BASE_URL__";
  </script>
  <script src="app.js"></script>
</body>
</html>
