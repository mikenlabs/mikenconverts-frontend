<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Convertly · Universal Converter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 32 32" width="32" height="32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="6" width="26" height="20" rx="5" stroke="currentColor" stroke-width="2.2" />
          <path d="M3 16H29" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
          <path d="M11 11V21M21 11V21" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
        <span class="brand-text">Convertly</span>
      </div>
      <p class="tagline">Currency · Crypto · Energy · Rate</p>
    </header>

    <nav class="tabs" role="tablist" aria-label="Converter types">
      <button role="tab" class="tab active" data-tab="currency" aria-selected="true" aria-controls="panel-currency">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="3" /><path d="M3 12h18" /><path d="M9 12v6" /><path d="M15 12v6" /></svg>
        <span>Currency</span>
      </button>
      <button role="tab" class="tab" data-tab="crypto" aria-selected="false" aria-controls="panel-crypto">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><path d="M12 6v12M6 12h12" /></svg>
        <span>Crypto</span>
      </button>
      <button role="tab" class="tab" data-tab="energy" aria-selected="false" aria-controls="panel-energy">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" /></svg>
        <span>Energy</span>
      </button>
      <button role="tab" class="tab" data-tab="rate" aria-selected="false" aria-controls="panel-rate">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><path d="M12 6v6l4 2" /></svg>
        <span>Rate</span>
      </button>
    </nav>

    <main class="panels">
      <section role="tabpanel" id="panel-currency" class="panel active" aria-labelledby="tab-currency" data-type="currency">
        <form class="converter-form" data-type="currency" novalidate>
          <div class="input-group">
            <label for="currency-amount">Amount</label>
            <div class="amount-row">
              <span class="currency-symbol" id="currency-from-symbol">$</span>
              <input type="number" id="currency-amount" name="amount" min="0" step="any" inputmode="decimal" placeholder="0.00" value="1" autocomplete="off" required />
            </div>
          </div>

          <div class="input-group">
            <label for="currency-from">From</label>
            <select id="currency-from" name="from" required></select>
          </div>

          <button type="button" class="swap-btn" data-type="currency" aria-label="Swap currencies">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V12H8" /><path d="M3 12C3 12 7 6 14 6H21" /><path d="M21 17V12H16" /><path d="M21 12C21 12 17 18 10 18H3" /></svg>
          </button>

          <div class="input-group">
            <label for="currency-to">To</label>
            <select id="currency-to" name="to" required></select>
          </div>

          <button type="submit" class="convert-btn">
            <span>Convert</span>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12H19" /><path d="M12 5L19 12L12 19" /></svg>
          </button>

          <output class="result" role="status" aria-live="polite"></output>
          <output class="error" role="alert" aria-live="assertive"></output>
        </form>
      </section>

      <section role="tabpanel" id="panel-crypto" class="panel" aria-labelledby="tab-crypto" data-type="crypto" hidden>
        <form class="converter-form" data-type="crypto" novalidate>
          <div class="input-group">
            <label for="crypto-amount">Amount</label>
            <div class="amount-row">
              <span class="currency-symbol" id="crypto-from-symbol">₿</span>
              <input type="number" id="crypto-amount" name="amount" min="0" step="any" inputmode="decimal" placeholder="0.00000000" value="1" autocomplete="off" required />
            </div>
          </div>

          <div class="input-group">
            <label for="crypto-from">From</label>
            <select id="crypto-from" name="from" required></select>
          </div>

          <button type="button" class="swap-btn" data-type="crypto" aria-label="Swap currencies">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V12H8" /><path d="M3 12C3 12 7 6 14 6H21" /><path d="M21 17V12H16" /><path d="M21 12C21 12 17 18 10 18H3" /></svg>
          </button>

          <div class="input-group">
            <label for="crypto-to">To</label>
            <select id="crypto-to" name="to" required></select>
          </div>

          <button type="submit" class="convert-btn">
            <span>Convert</span>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12H19" /><path d="M12 5L19 12L12 19" /></svg>
          </button>

          <output class="result" role="status" aria-live="polite"></output>
          <output class="error" role="alert" aria-live="assertive"></output>
        </form>
      </section>

      <section role="tabpanel" id="panel-energy" class="panel" aria-labelledby="tab-energy" data-type="energy" hidden>
        <form class="converter-form" data-type="energy" novalidate>
          <div class="input-group">
            <label for="energy-amount">Amount</label>
            <input type="number" id="energy-amount" name="amount" min="0" step="any" inputmode="decimal" placeholder="0.00" value="1" autocomplete="off" required />
          </div>

          <div class="input-group">
            <label for="energy-from">From</label>
            <select id="energy-from" name="from" required></select>
          </div>

          <button type="button" class="swap-btn" data-type="energy" aria-label="Swap units">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V12H8" /><path d="M3 12C3 12 7 6 14 6H21" /><path d="M21 17V12H16" /><path d="M21 12C21 12 17 18 10 18H3" /></svg>
          </button>

          <div class="input-group">
            <label for="energy-to">To</label>
            <select id="energy-to" name="to" required></select>
          </div>

          <button type="submit" class="convert-btn">
            <span>Convert</span>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12H19" /><path d="M12 5L19 12L12 19" /></svg>
          </button>

          <output class="result" role="status" aria-live="polite"></output>
          <output class="error" role="alert" aria-live="assertive"></output>
        </form>
      </section>

      <section role="tabpanel" id="panel-rate" class="panel" aria-labelledby="tab-rate" data-type="rate" hidden>
        <form class="converter-form" data-type="rate" novalidate>
          <div class="input-group">
            <label for="rate-amount">Amount</label>
            <input type="number" id="rate-amount" name="amount" min="0" step="any" inputmode="decimal" placeholder="0.00" value="1" autocomplete="off" required />
          </div>

          <div class="input-group">
            <label for="rate-from">From</label>
            <select id="rate-from" name="from" required></select>
          </div>

          <button type="button" class="swap-btn" data-type="rate" aria-label="Swap units">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V12H8" /><path d="M3 12C3 12 7 6 14 6H21" /><path d="M21 17V12H16" /><path d="M21 12C21 12 17 18 10 18H3" /></svg>
          </button>

          <div class="input-group">
            <label for="rate-to">To</label>
            <select id="rate-to" name="to" required></select>
          </div>

          <button type="submit" class="convert-btn">
            <span>Convert</span>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12H19" /><path d="M12 5L19 12L12 19" /></svg>
          </button>

          <output class="result" role="status" aria-live="polite"></output>
          <output class="error" role="alert" aria-live="assertive"></output>
        </form>
      </section>
    </main>

    <footer class="footer">
      <p>Rates from European Central Bank · Crypto from CoinGecko · Energy/Rate via standard SI conversions</p>
    </footer>
  </div>

  <script>
    window.__API_BASE__ = "__API_BASE_URL__";
  </script>
  <script src="app.js"></script>
</body>
</html>
