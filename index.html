<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Convertly · Currency Converter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <header class="header">
      <h1>Convertly</h1>
      <p class="subtitle">Currency Converter</p>
    </header>

    <form class="converter" id="converter-form" novalidate>
      <div class="input-group">
        <label for="amount">Amount</label>
        <div class="amount-row">
          <span class="currency-symbol" id="from-symbol">$</span>
          <input type="number" id="amount" name="amount" min="0" step="any" inputmode="decimal" placeholder="0.00" value="1" autocomplete="off" required />
        </div>
      </div>

      <div class="input-group">
        <label for="from">From</label>
        <select id="from" name="from" required></select>
      </div>

      <button type="button" id="swap" class="swap-btn" aria-label="Swap currencies">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7V12H8" />
          <path d="M3 12C3 12 7 6 14 6H21" />
          <path d="M21 17V12H16" />
          <path d="M21 12C21 12 17 18 10 18H3" />
        </svg>
      </button>

      <div class="input-group">
        <label for="to">To</label>
        <select id="to" name="to" required></select>
      </div>

      <button type="submit" id="convert" class="convert-btn">
        <span>Convert</span>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12H19" />
          <path d="M12 5L19 12L12 19" />
        </svg>
      </button>

      <output id="result" class="result" role="status" aria-live="polite"></output>
      <output id="error" class="error" role="alert" aria-live="assertive"></output>
    </form>

    <footer class="footer">
      <p>Rates from European Central Bank via Frankfurter API</p>
    </footer>
  </main>

  <script>
    window.__API_BASE__ = "__API_BASE_URL__";
  </script>
  <script src="app.js"></script>
</body>
</html>
