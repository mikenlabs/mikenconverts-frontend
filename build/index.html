<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Convertly · Currency Converter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-orbs" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
  </div>

  <main class="page">
    <header class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="34" height="34" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="6" width="26" height="20" rx="5" stroke="currentColor" stroke-width="2.2" />
          <path d="M3 16H29" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
          <path d="M11 11V21M21 11V21" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </div>
      <div class="brand-text">
        <h1>Convertly</h1>
        <p>Live currency conversion</p>
      </div>
    </header>

    <section class="card" aria-label="Currency converter">
      <div class="field">
        <div class="field-head">
          <label for="amount">Amount</label>
          <span class="hint" id="rate-hint">—</span>
        </div>
        <input type="number" id="amount" min="0" step="any" inputmode="decimal" placeholder="0.00" value="1" autocomplete="off" />
      </div>

      <div class="swap-row">
        <div class="field">
          <label for="from">From</label>
          <select id="from"></select>
        </div>

        <button id="swap" class="swap-btn" aria-label="Swap currencies" title="Swap currencies">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7V12H8" />
            <path d="M3 12C3 12 7 6 14 6H21" />
            <path d="M21 17V12H16" />
            <path d="M21 12C21 12 17 18 10 18H3" />
          </svg>
        </button>

        <div class="field">
          <label for="to">To</label>
          <select id="to"></select>
        </div>
      </div>

      <button id="convert" class="convert-btn">
        <span class="btn-label">Convert</span>
        <svg class="btn-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12H19" />
          <path d="M12 5L19 12L12 19" />
        </svg>
      </button>

      <div id="result" class="result" role="status" aria-live="polite"></div>
      <div id="error" class="error" role="alert" aria-live="assertive"></div>
    </section>

    <footer class="footnote">
      <span>Rates sourced live from the European Central Bank via Frankfurter.</span>
    </footer>
  </main>

  <script>
    // http://localhost:3000 is replaced at build time by build.js.
    window.__API_BASE__ = "http://localhost:3000";
  </script>
  <script src="app.js"></script>
</body>
</html>
